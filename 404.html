<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הדף לא נמצא · התבשילים של סיגל</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Rubik:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe6;--card:#fffdf8;--ink:#1a1410;--paprika:#d2491e}
@media (prefers-color-scheme:dark){:root{--paper:#17130f;--card:#251f19;--ink:#f1e9dc;--paprika:#e8632f}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,sans-serif;background-image:radial-gradient(rgba(128,110,90,.25) 1px,transparent 1.2px);background-size:22px 22px}
.c{background:var(--card);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:32px 26px;max-width:460px;text-align:center}
.k{display:inline-block;font-family:"IBM Plex Mono",monospace;background:var(--ink);color:var(--paper);padding:4px 10px;direction:ltr;margin-bottom:14px}
h1{font-size:44px;font-weight:900;line-height:1}
h1 em{font-style:normal;color:var(--paprika)}
p{margin:14px 0 22px;font-size:17px}
a.b{display:inline-block;background:var(--paprika);color:#fff;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 22px;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main class="c">
<span class="k">404 · NOT FOUND</span>
<h1>הסיר <em>ריק</em></h1>
<p>הדף שחיפשתם לא נמצא. אבל במטבח של סיגל תמיד יש משהו חם.</p>
<a class="b" href="./">חזרה לתפריט</a>
</main>
</body>
</html>
